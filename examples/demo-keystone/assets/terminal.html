<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.css">
<style>html,body{margin:0;height:100%;background:#1b1d23;overflow:hidden}#p{height:100%}
.ap-wrapper,.ap-player{background:#1b1d23!important}.ap-terminal{font-family:"JetBrains Mono",Menlo,monospace!important}
.badge{position:fixed;top:14px;right:18px;z-index:9;background:#F4A93C;color:#1E293B;font:600 15px "JetBrains Mono",monospace;padding:5px 11px;border-radius:6px}</style></head>
<body><div class="badge" id="bd"></div><div id="p"></div>
<script src="https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.min.js"></script>
<script>
// A real terminal session recorded as asciicast, replayed so it lasts as long as the spoken line.
// #src=<cast>&len=<seconds after idle compression>&dur=<seconds to fill>&label=<badge>
const q = Object.fromEntries(location.hash.slice(1).split('&').map(x => x.split('=').map(decodeURIComponent)))
const len = +q.len || 60, dur = +q.dur || 0, speed = dur ? len / dur : 1
document.getElementById('bd').textContent = (q.label || 'terminal real') + (speed > 1.5 ? ' · ×' + Math.round(speed) : '')
AsciinemaPlayer.create(q.src, document.getElementById('p'), { autoPlay: true, speed, idleTimeLimit: 0.5, fit: 'both', controls: false, theme: 'monokai' })
</script></body></html>
