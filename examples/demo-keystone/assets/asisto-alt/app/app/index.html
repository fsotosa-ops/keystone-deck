<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asisto (app ficticia)</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', -apple-system, sans-serif; background: #F3F6FA; color: #1E293B; }
  /* ---------- Paciente: el celular (el deck recorta este marco) */
  .escena-tel { min-height: 100vh; display: grid; place-items: center; background: transparent; }
  .celular { width: 390px; height: 800px; background: #0B0F19; border-radius: 56px; padding: 12px; position: relative; }
  .pant { width: 100%; height: 100%; background: #EEF2F7; border-radius: 46px; overflow: hidden; display: flex; flex-direction: column; }
  .estado { display: flex; justify-content: space-between; padding: 16px 30px 6px; font-size: 14px; font-weight: 600; }
  .isla { position: absolute; top: 22px; left: 50%; translate: -50% 0; width: 110px; height: 30px; border-radius: 20px; background: #0B0F19; }
  .cab { background: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E4E7EC; }
  .av { width: 42px; height: 42px; border-radius: 50%; background: #1652E0; display: grid; place-items: center; }
  .cab b { display: block; font-size: 16px; } .cab small { color: #667085; font-size: 12px; }
  .chat { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .msg { max-width: 84%; padding: 11px 14px; border-radius: 18px; background: #fff; font-size: 15.5px; line-height: 1.35;
         box-shadow: 0 1px 1px rgba(0,0,0,.05); animation: entra .35s ease both; }
  .msg.yo { align-self: flex-end; background: #1652E0; color: #fff; }
  .msg.ok { border-left: 4px solid #1F7A5C; }
  .msg .hora { display: inline-block; font-weight: 700; color: #1652E0; }
  .botones { display: flex; gap: 8px; margin-top: 10px; }
  .botones button { flex: 1; font: inherit; font-weight: 600; font-size: 15px; padding: 10px 6px; border-radius: 12px; border: 1.5px solid #1652E0;
                    background: #fff; color: #1652E0; cursor: pointer; }
  .botones button.usado { opacity: .45; }
  .dia { align-self: center; font-size: 12px; color: #98A2B3; }
  .escribiendo { align-self: flex-start; background: #fff; border-radius: 18px; padding: 12px 16px; display: flex; gap: 5px; }
  .escribiendo i { width: 7px; height: 7px; border-radius: 50%; background: #98A2B3; animation: pt 1s infinite; }
  .escribiendo i:nth-child(2) { animation-delay: .15s } .escribiendo i:nth-child(3) { animation-delay: .3s }
  @keyframes entra { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes pt { 50% { opacity: .3 } }
  /* ---------- Centro: la agenda (1440 x 900) */
  .centro { width: 1440px; height: 900px; display: flex; background: #F6F8FB; }
  nav { width: 230px; background: #0B1F4D; color: #C9D6F2; padding: 28px 22px; display: flex; flex-direction: column; gap: 16px; font-size: 16px; }
  nav .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 18px; }
  nav .on { color: #fff; font-weight: 600; }
  main { flex: 1; padding: 30px 36px; display: flex; flex-direction: column; gap: 22px; }
  main h1 { font-size: 28px; font-weight: 600; } main h1 small { display: block; font-size: 15px; color: #667085; font-weight: 400; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .k { background: #fff; border: 1px solid #E4E7EC; border-radius: 14px; padding: 18px 22px; }
  .k b { display: block; font-size: 42px; color: #1652E0; font-weight: 600; letter-spacing: -.02em; transition: color .4s; }
  .k b.salta { color: #1F7A5C; }
  .k span { font-size: 15px; color: #667085; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #E4E7EC; border-radius: 14px; overflow: hidden; font-size: 17px; }
  th, td { padding: 13px 20px; border-bottom: 1px solid #EEF1F5; text-align: left; }
  th { font-size: 13px; color: #667085; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  tr { transition: background .5s; } tr.cambia { background: #FFF8EC; }
  .p { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .Confirmada { background: #E7F5EF; color: #1F7A5C } .Pendiente { background: #EEF2F7; color: #475467 }
  .Liberada { background: #FFF4E5; color: #B45309 } .Reasignada { background: #EAF0FF; color: #1652E0 }
</style>
</head>
<body>
<div id="raiz"></div>
<script>
// App ficticia para la demo. Estado en localStorage: el celular y el laptop se enteran entre sí por el evento 'storage'.
(() => {
  const KEY = 'asisto-demo-v1'
  const LOGO = '<svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="5" rx="1.5" fill="#fff"/><circle cx="12" cy="6" r="3" fill="#F4A93C"/><path d="M8.5 14v-2.5a3.5 3.5 0 0 1 7 0V14" fill="#F4A93C"/></svg>'
  const base = () => ({
    chat: [],
    agenda: [
      { h: '09:00', p: 'J. Pérez', e: 'Confirmada' }, { h: '09:30', p: 'A. Soto', e: 'Confirmada' },
      { h: '10:00', p: 'C. Díaz', e: 'Confirmada' }, { h: '10:30', p: 'M. Fuentes', e: 'Pendiente' },
      { h: '11:00', p: 'R. Muñoz', e: 'Confirmada' }, { h: '11:30', p: 'P. Lagos', e: 'Confirmada' }],
    recuperadas: 13, espera: 36, escribiendo: false })
  let E = JSON.parse(localStorage.getItem(KEY) || 'null') || base()
  const guardar = () => localStorage.setItem(KEY, JSON.stringify(E))
  const espera = ms => new Promise(r => setTimeout(r, ms))
  const ruta = () => location.hash.replace('#', '') || '/paciente'

  const RECORDATORIO = { de: 'asisto', html: 'Hola, Marta. El <span class="hora">jueves a las 10:30</span> tienes hora con medicina general en el Centro de Salud Norte. ¿Vas a poder ir?', botones: true }

  function paciente() {
    const msgs = E.chat.map((m, i) => {
      const bot = m.botones ? `<div class="botones"><button data-acc="voy" class="${E.respondio ? 'usado' : ''}">Sí, voy</button><button data-acc="no-puedo" class="${E.respondio ? 'usado' : ''}">No puedo</button></div>` : ''
      return `<div class="msg ${m.de === 'yo' ? 'yo' : ''} ${m.ok ? 'ok' : ''}" data-i="${i}">${m.html}${bot}</div>`
    }).join('')
    return `<div class="escena-tel"><div class="celular"><div class="isla"></div><div class="pant">
      <div class="estado"><span>9:41</span><span>●●● 5G</span></div>
      <div class="cab"><div class="av">${LOGO}</div><div><b>Asisto · Centro de Salud Norte</b><small>Recordatorios de tus horas</small></div></div>
      <div class="chat"><div class="dia">Martes 9:02</div>${msgs}${E.escribiendo ? '<div class="escribiendo"><i></i><i></i><i></i></div>' : ''}</div>
    </div></div></div>`
  }

  function centro() {
    const filas = E.agenda.map(f => `<tr data-h="${f.h}" class="${f.cambia ? 'cambia' : ''}"><td>${f.h}</td><td>${f.p}</td><td><span class="p ${f.e}">${f.e}</span></td></tr>`).join('')
    return `<div class="centro"><nav><div class="logo">${LOGO} Asisto</div><span class="on">Agenda de hoy</span><span>Lista de espera</span><span>Reportes</span><span>Ajustes</span></nav>
      <main><h1>Agenda del jueves<small>Centro de Salud Norte · Medicina general</small></h1>
      <div class="kpis"><div class="k k-espera"><b>${E.espera}</b><span>personas en lista de espera</span></div><div class="k k-confirmadas"><b>${Math.round(100 * E.agenda.filter(f => f.e !== 'Pendiente').length / E.agenda.length)}%</b><span>de la agenda confirmada</span></div>
        <div class="k k-recuperadas"><b class="${E.salta ? 'salta' : ''}">${E.recuperadas}</b><span>horas recuperadas esta semana</span></div>
        </div>
      <table><tr><th>Hora</th><th>Paciente</th><th>Estado</th></tr>${filas}</table></main></div>`
  }

  function render() { document.getElementById('raiz').innerHTML = ruta().startsWith('/centro') ? centro() : paciente() }

  async function decir(m, pausa = 900) {
    E.escribiendo = true; guardar(); render(); await espera(pausa)
    E.escribiendo = false; E.chat.push(m); guardar(); render()
  }

  async function noPuedo() {
    if (E.respondio) return
    E.respondio = true; E.chat.push({ de: 'yo', html: 'No puedo' }); guardar(); render()
    await espera(500)
    const f = E.agenda.find(x => x.h === '10:30'); f.e = 'Liberada'; f.cambia = true; guardar(); render()
    await decir({ de: 'asisto', ok: true, html: 'Gracias por avisar. Tu hora quedó libre para alguien de la lista de espera. ¿Te busco otra esta semana?' }, 800)
    await espera(700)
    f.e = 'Reasignada'; f.p = 'L. Gómez'; E.recuperadas += 1; E.espera -= 1; E.salta = true; guardar(); render()
  }

  document.addEventListener('click', e => { const b = e.target.closest('[data-acc]'); if (!b) return; if (b.dataset.acc === 'no-puedo') noPuedo() })
  addEventListener('storage', ev => { if (ev.key === KEY) { E = JSON.parse(ev.newValue || 'null') || base(); render() } })
  addEventListener('hashchange', render)

  window.__app = {
    estado: () => E, guardar, render, recargar: () => { E = base(); guardar(); render() },
    reiniciar(conRecordatorio = false) { E = base(); if (conRecordatorio) E.chat = [RECORDATORIO]; guardar(); render() },
    decir, noPuedo, RECORDATORIO,
  }
  render()
})()
</script>
</body>
</html>
