<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Presenter</title>
<link rel="stylesheet" href="brand.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--ks-font-body, system-ui); background: var(--ks-bg-dark, #111); color: var(--ks-ink-inverse, #eee);
         padding: 28px 32px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; }
  .n { font-family: var(--ks-font-mono, monospace); color: var(--ks-muted-inverse, #aaa); font-size: 15px; }
  h1 { font-family: var(--ks-font-display, system-ui); font-size: 28px; letter-spacing: -.01em; }
  .clock { font-family: var(--ks-font-mono, monospace); font-size: 30px; color: var(--ks-accent-inverse, #8ab4ff); }
  .budget { font-size: 14px; color: var(--ks-muted-inverse, #aaa); text-align: right; }
  main { overflow: auto; display: flex; flex-direction: column; gap: 14px; font-size: 22px; line-height: 1.45; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ks-muted-inverse, #aaa); margin-bottom: 4px; }
  .on-slide { color: var(--ks-muted-inverse, #aaa); font-size: 18px; }
  .leads { border-left: 3px solid var(--ks-accent-inverse, #8ab4ff); padding-left: 12px; font-size: 19px; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--ks-muted-inverse, #aaa); font-size: 16px; }
  button { font: inherit; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--ks-muted-inverse, #aaa); background: transparent; color: inherit; cursor: pointer; }
  button.go { background: var(--ks-accent, #36f); color: var(--ks-on-accent, #fff); border-color: transparent; }
</style>
</head>
<body>
<header>
  <div><div class="n" id="n">waiting for the deck…</div><h1 id="title"></h1></div>
  <div><div class="clock" id="clock">0:00</div><div class="budget" id="budget"></div></div>
</header>
<main>
  <div><div class="label">On slide</div><div class="on-slide" id="onSlide"></div></div>
  <div><div class="label">Say</div><div id="notes"></div></div>
  <div class="leads" id="leads"></div>
</main>
<footer>
  <div>Next: <b id="next"></b></div>
  <div><button id="prev">← Back</button> <button class="go" id="fwd">Next →</button></div>
</footer>
<script>
  const ch = new BroadcastChannel(new URLSearchParams(location.search).get('channel') || 'keystone-deck')
  const t0 = Date.now(), $ = id => document.getElementById(id)
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`
  setInterval(() => { $('clock').textContent = fmt((Date.now() - t0) / 1000) }, 500)
  ch.onmessage = e => {
    const d = e.data; if (typeof d !== 'object') return
    $('n').textContent = `${d.n} / ${d.total}` + (d.steps ? ` · step ${d.step}/${d.steps}` : '') + (d.speaker ? ` · ${d.speaker}` : '')
    $('title').textContent = d.title
    $('onSlide').textContent = d.onSlide
    $('notes').textContent = d.notes
    $('leads').textContent = d.leadsTo ? 'Leads to: ' + d.leadsTo : ''
    $('budget').textContent = d.seconds ? 'slide budget ' + fmt(d.seconds) : ''
    $('next').textContent = d.next
  }
  $('fwd').onclick = () => ch.postMessage('next')
  $('prev').onclick = () => ch.postMessage('prev')
  addEventListener('keydown', e => { if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) ch.postMessage('next'); if (['ArrowLeft', 'PageUp'].includes(e.key)) ch.postMessage('prev') })
  ch.postMessage('hello')
</script>
</body>
</html>
